# ==============================================================================
# BLOCK 1: METADATA BLOCK
# ( Container Orchestration Identity & Service Manifest )
# ==============================================================================
# OmniCode Bare-Metal Toolchain & Emulation Infrastructure
# Multi-arch environment for bare-metal kernels, LLVM toolchains, and QEMU hardware emulation.

# ==============================================================================
# BLOCK 2: OPENING BLOCK
# ( Environment Invariants, Volume Mounts & Service Declaration )
# ==============================================================================
services:
  omnicode-toolchain:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnicode-toolchain:latest
    container_name: omnicode-toolchain
    stdin_open: true
    tty: true
    working_dir: /workspace

# ==============================================================================
# BLOCK 3: BODY BLOCK
# ( Service Topology, Volume Caching & Debugging Stubs )
# ==============================================================================
    volumes:
      - .:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/workspace/target
    ports:
      - "1234:1234" # QEMU GDB debugging stub
      - "5900:5900" # Optional QEMU VNC display
    environment:
      - RUST_BACKTRACE=1
    command: bash

# ==============================================================================
# BLOCK 4: CLOSING BLOCK
# ( Volume Persistence & Network Invariant Teardown )
# ==============================================================================
volumes:
  cargo-cache:
  cargo-git:
  target-cache:
