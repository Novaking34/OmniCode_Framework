# @scale         O(1) package contract governing lib, CLI bin & 7 test harnesses
# @seams         in: Cargo.lock, Track 1 src/ | exports: `omnicode` lib & binary
# @invariants    1. Universal 5-Block Lifecycle Protocol (Rev 5).
#                2. Coordinate Versioning (`M.m.p`): `0.1.3` = 13% toward
#                   `1.0.0`.
#                3. Zero-Bloat Dependency Policy: no external parser generators,
#                   async runtimes, or third-party bloat crates.
#                4. Rust 2024 Edition (`rust-version = "1.85+"`), zero warnings.
#                5. Root submodules (`FaithNet/`, `Tenebris-and-Lux/`) stay
#                   decoupled from this package's exclude/source boundaries.
#
# PURPOSE & ARCHITECTURAL ROLE:
#   Root Cargo contract for the OmniCode Host Engine (Track 1). Unifies
#   bare-metal silicon control (Track 0), balanced ternary quad-state physics
#   (T4 = {-1, 0, +1, NULL}), morphological boundary brackets, first-class
#   asides `(...)`, the DAR diagnostic loop (Detect, Assess, Restore), and the
#   native CPI-SI cognitive cortex.
#
#   ### For Everyday Builders & Non-Programmers:
#   This is the master build recipe that turns OmniCode's Rust source code into
#   the `omnicode` command-line tool and runs all 542 automated verification
#   checks in seconds—with almost zero outside dependencies to break over time.
#
#   ### For Systems Programmers & Engine Architects:
#   Enforces Edition 2024 compilation, pins `rustyline` as the sole production
#   dependency, wires the 7 stratified test suites, and configures release LTO
#   (`panic = "abort"`, `codegen-units = 1`) for compact bare-metal portability.
# ==============================================================================

[package]
name = "omnicode"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
authors = ["ProfessorSeanEX", "Novaking34", "CreativeWorkzStudio LLC"]
description = """\
A Dual-Readable Ontological Programming Language Engine Grounded in Balanced \
Ternary and Morphological Boundaries"""
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Novaking34/OmniCode_Framework"
homepage = "https://github.com/Novaking34/OmniCode_Framework"
documentation = "https://github.com/Novaking34/OmniCode_Framework/tree/master/docs"
keywords = [
    "omnicode",
    "ternary",
    "compiler",
    "ontology",
    "ai-model",
    "operating-system",
    "bare-metal",
]
categories = ["compilers", "development-tools"]
exclude = [
    "/target",
    "/FaithNet",
    "/Tenebris-and-Lux",
    "*.vsix",
    "node_modules/",
    ".DS_Store"
]


# ==============================================================================
# BLOCK 2: OPENING BLOCK
# ( Engine Dependencies, Runtime Context & Zero-Bloat Guardrails )
# ==============================================================================
# DEPENDENCY POLICY & JUSTIFICATION:
#   - Zero-Bloat Philosophy:
#     OmniCode does NOT pull in external parser generators (`nom`), regex
#     engines, heavy serialization (`serde`), or async runtimes (`tokio`).
#     Every core organ—lexer, parser, balanced-ternary evaluator, transactional
#     debugger, self-healing restorator, cooperative scheduler, and native
#     CPI-SI AI cortex—is implemented natively in Rust.
#   - rustyline (18.0.1):
#     Sole production dependency. Provides cross-platform terminal line-editing,
#     ANSI escape handling, history persistence (`.omnicode_history`), and
#     multi-line bracket-balanced input buffering for the interactive REPL.
# ==============================================================================

[dependencies]
# Interactive CLI shell line-editing, input buffering, and terminal history
rustyline = "18.0.1"


# ==============================================================================
# BLOCK 3: BODY BLOCK
# ( Target Layout, Compilation Binaries, Integration Test Suites & Profiles )
# ==============================================================================
# TARGET TOPOLOGY & ARCHITECTURAL DECOUPLING:
#   - [lib] (Track 1 / src/lib.rs):
#     Exposes `core`, `ast`, `parser`, `runtime`, `diagnostics` (DAR), `ai`,
#     `cogs`, and `terminal`.
#   - [[bin]] (Track 1 / src/main.rs):
#     CLI dispatcher hosting `repl`, `run` (.omni/.scroll/.tape), `echo`,
#     `assemble`, `studio`, `boot`, `lint`, `hover`, `doc`, `restore`, `ai`,
#     `interact`, `train`, `noise`, `query`, `diagnose`, `rotate`, `scrolls`,
#     `manifest`, `lexicon`, `gui`, `desktop`, `scaffold`, `filetypes`, `demo`.
# ==============================================================================

[lib]
name = "omnicode"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/src/lib.rs"

[[bin]]
name = "omnicode"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/src/main.rs"

# ------------------------------------------------------------------------------
# 3.1 Stratified Test Suite Topology (Unit, Integrated, Functional, Tripwires)
# ------------------------------------------------------------------------------

# 1. Component Isolation Unit Test Suite
[[test]]
name = "unit_tests"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/tests/unit/main.rs"

# 2. Subsystem Integration & DAR Self-Healing Feedback Loop Suite
[[test]]
name = "integrated_tests"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/tests/integrated/main.rs"

# 3. End-to-End Functional, AI Cortex & File Lifecycle Suite
[[test]]
name = "functional_tests"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/tests/functional/main.rs"

# 4. Track 0 Bare-Metal Boot Inception, Tripwires & Telemetry Oracle Suite
[[test]]
name = "boot_tripwire_tests"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/tests/integrated/boot_tripwire_tests.rs"

# 5. Platform Adapter Adversarial Faults & Telemetry Oracle Suite
[[test]]
name = "platform_tripwire_tests"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/tests/integrated/platform_tripwire_tests.rs"

# 6. Physical Assembler & Process Tape Lowering Adversarial Tripwire Suite
[[test]]
name = "assemble_tripwire_tests"
path = "<TRACK 1> : {Host Engine & Virtual Machine}/tests/integrated/assemble_tripwire_tests.rs"

# ------------------------------------------------------------------------------
# 3.2 Compilation Profiles & Bare-Metal Optimizations
# ------------------------------------------------------------------------------

# Development profile: Fast compilation, full debug symbols, overflow checks
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# Release profile: Maximum speed, LTO, compact bare-metal-ready binary
[profile.release]
opt-level = 3
lto = true             # Cross-crate inlining for zero-cost abstractions
codegen-units = 1      # Single codegen unit for full LLVM inter-procedural opt
panic = "abort"        # Eliminates unwind tables & eh_personality runtime bloat
strip = "debuginfo"    # Strips debug symbols for compact native binaries

# Benchmark profile: Release optimizations with debug symbols preserved
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1


